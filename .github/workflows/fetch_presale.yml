name: 每小时获取来龙餐馆预售票房

on:
  schedule:
    # 每5分钟执行一次（GitHub Actions最小粒度，实际可能有延迟）
    - cron: '0 * * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 获取猫眼专业版数据
        run: |
          curl -s -L \
            -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1" \
            "https://piaofang.maoyan.com/i/imovie/1462628/premiere?barTheme=582828" > maoyan.html
          
          python3 -c "
          import re, json
          from datetime import datetime, timezone, timedelta
          
          BEIJING_TZ = timezone(timedelta(hours=8))
          
          with open('maoyan.html', 'r', encoding='utf-8') as f:
              html = f.read()
          
          m = re.search(r'var props = ({.*?});\s*var App', html, re.DOTALL)
          if not m:
              print('ERROR: 未找到数据')
              exit(1)
          
          data = json.loads(m.group(1))
          info = data['data']['movieInfo']
          desc = info.get('indexDesc', '')
          num_match = re.search(r'([\d.]+)万', desc)
          total_presale = float(num_match.group(1)) if num_match else 0
          release_days = info.get('releaseDays', 0)
          day_str = f'映前{abs(release_days)}天' if release_days < 0 else f'上映第{release_days}天'
          now = datetime.now(BEIJING_TZ)
          
          # 写入最新数据
          with open('latest.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'fetch_time': now.strftime('%Y-%m-%d %H:%M:%S'),
                  'timezone': 'UTC+8',
                  'movie': '欢迎来龙餐馆',
                  'release_days': release_days,
                  'day_str': day_str,
                  'total_presale_wan': total_presale,
                  'index_desc': desc,
                  'source': '猫眼专业版'
              }, f, ensure_ascii=False, indent=2)
          
          # 追加到历史记录
          import os
          history = []
          if os.path.exists('history.json'):
              with open('history.json', 'r', encoding='utf-8') as f:
                  history = json.load(f)
          
          history.append({
              'fetch_time': now.strftime('%Y-%m-%d %H:%M:%S'),
              'day_str': day_str,
              'total_presale_wan': total_presale,
              'index_desc': desc
          })
          
          with open('history.json', 'w', encoding='utf-8') as f:
              json.dump(history, f, ensure_ascii=False, indent=2)
          
          # 追加到CSV历史记录（含每日预售明细，UTF-8 BOM编码）
          import csv, io
          csv_headers = [
              'fetch_time', 'day_str', 'total_presale_wan', 'index_desc',
              '8/8_类型', '8/8_票房(万)', '8/8_场次', '8/8_人次',
              '8/9_类型', '8/9_票房(万)', '8/9_场次', '8/9_人次',
              '8/10_类型', '8/10_票房(万)', '8/10_场次', '8/10_人次',
              '8/11_类型', '8/11_票房(万)', '8/11_场次', '8/11_人次',
          ]
          date_col_map = {'8/8': 4, '8/9': 8, '8/10': 12, '8/11': 16}
          
          # 从原始数据提取daily
          daily_list = data.get('data', {}).get('daily', [])
          csv_row = [''] * len(csv_headers)
          csv_row[0] = now.strftime('%Y-%m-%d %H:%M:%S')
          csv_row[1] = day_str
          csv_row[2] = total_presale
          csv_row[3] = desc
          for d in daily_list:
              d_date = d.get('date', '')
              if d_date in date_col_map:
                  base = date_col_map[d_date]
                  csv_row[base] = d.get('type', '')
                  csv_row[base + 1] = d.get('box_wan', '')
                  csv_row[base + 2] = d.get('shows', '')
                  csv_row[base + 3] = d.get('views', '')
          
          file_exists = os.path.exists('history.csv')
          with open('history.csv', 'a', encoding='utf-8-sig', newline='') as f:
              writer = csv.writer(f, delimiter=',', quotechar='"', quoting=csv.QUOTE_ALL)
              if not file_exists:
                  writer.writerow(csv_headers)
              writer.writerow(csv_row)
          
          print(f'[{now.strftime(\"%Y-%m-%d %H:%M\")} 北京时间] {day_str} | {desc}')
          "
      
      - name: 提交数据
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add latest.json history.json history.csv
          git diff --staged --quiet && echo "无新数据" || (git commit -m "更新预售数据 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')" && git push)
